spring.application.name=spot-admission-portal

# Dynamic Environment Variables with Local Fallbacks
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:cet_students}
spring.datasource.username=${DB_USER:harsh}
spring.datasource.password=${DB_PASSWORD:2912}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicitly informs Hibernate to use PostgreSQL syntax features
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# ⚡ HIGH-PERFORMANCE BATCH SETTINGS (CRITICAL FOR EXCEL IMPORT)
# ===================================================================
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true