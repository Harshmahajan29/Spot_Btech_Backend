spring.application.name=spot-admission-portal
server.port=${PORT:8080}

# Dynamic Environment Variables with Local Fallbacks
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:cet_students}
spring.datasource.username=${DB_USER:harsh}
spring.datasource.password=${DB_PASSWORD:2912}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# 🗄️ HIBERNATE SCHEMA & DIALECT MANAGEMENT (CRITICAL FOR AWS)
# ===================================================================
# Validates database schema on launch without wiping production data
spring.jpa.hibernate.ddl-auto=none

# Turn OFF SQL logging in production for performance (optional but recommended)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Explicitly informs Hibernate to use PostgreSQL syntax features
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File uploads limit
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# ⚡ HIGH-PERFORMANCE BATCH SETTINGS (CRITICAL FOR EXCEL IMPORT)
# ===================================================================
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===================================================================
# 🔌 HIKARICP CONNECTION POOLING (PREVENTS RDS TIMEOUTS)
# ===================================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000