name: Deploy Spring Boot Backend to Elastic Beanstalk

on:
  push:
    branches:
      - main  # Set this to your primary branch name (e.g., main or master)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Build executable JAR file
      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      # 4. Deploy JAR to Elastic Beanstalk
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: '${{ secrets.AWS_ACCESS_KEY_ID }}'
          aws_secret_key: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          application_name: "spot-btech-backend"       # Exact EB Application Name
          environment_name: "spot-btech-backend-env"  # Exact EB Environment Name
          version_label: "build-${{ github.run_number }}"
          region: "eu-north-1"                          # AWS Region
          deployment_package: "target/*.jar"